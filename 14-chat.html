<button class="chat-fab" onclick="openChat()" aria-label="Open live chat">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
</button>
<div class="chat-panel" id="chatPanel">
  <div class="chat-head"><div><b>Fundedapple support</b><br><span>Replies by email</span></div><button class="chat-close" onclick="closeChat()">✕</button></div>
  <div class="chat-body">
    <div class="chat-bubble">Hi! Drop your question here and we will get back to you immediately.</div>
  </div>
  <div class="chat-input-row"><input type="text" id="chatMsgInput" placeholder="Type your message..."><button onclick="sendChatAsEmail()">Send</button></div>
</div>
