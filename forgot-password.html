<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password — Fundedapple</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="icon" type="image/png" href="assets/logo-mark.png">

<link rel="stylesheet" href="css/styles.css?v=logo-fix-2">
<link rel="stylesheet" href="css/login.css">

<style>
  /* =====================================================
     THEME VARIABLES
  ===================================================== */
  :root {
    --bg: #070a08;
    --surface: #0e1411;
    --card-bg: rgba(18, 26, 22, 0.55);
    --card-border: rgba(255, 255, 255, 0.08);
    --text: #f0f4f1;
    --text-soft: #9ea8a1;
    --green: #7fcb96;
    --green-glow: rgba(127, 203, 150, 0.22);
    --green-dark: rgba(127, 203, 150, 0.08);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1160px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* =====================================================
     PAGE BACKGROUND
  ===================================================== */
  .login-page {
    min-height: 100vh;
    background:
      radial-gradient(circle at 50% 0%, rgba(127, 203, 150, 0.07) 0%, transparent 60%),
      radial-gradient(circle at 100% 100%, rgba(127, 203, 150, 0.04) 0%, transparent 50%),
      var(--bg);
  }

  /* =====================================================
     TOP NAV
  ===================================================== */
  .login-top {
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    background: rgba(8, 12, 10, 0.85);
    backdrop-filter: blur(16px);
    position: sticky;
    top: 0;
    z-index: 50;
  }

  .login-nav {
    min-height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
  }

  .login-brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: -0.01em;
  }

  .login-brand img {
    width: 24px;
    height: 24px;
    object-fit: contain;
    filter: drop-shadow(0 0 8px rgba(127, 203, 150, 0.3));
  }

  .login-back {
    color: var(--text-soft);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid transparent;
    transition: all 0.2s ease;
  }

  .login-back:hover {
    color: #fff;
    background: rgba(255, 255, 255, 0.04);
    border-color: rgba(255, 255, 255, 0.08);
  }

  /* =====================================================
     MAIN & CARD
  ===================================================== */
  .login-main {
    min-height: calc(100vh - 72px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 24px;
  }

  .login-card {
    width: 100%;
    max-width: 440px;
    padding: 40px 32px;
    border: 1px solid var(--card-border);
    border-radius: 18px;
    background: var(--card-bg);
    backdrop-filter: blur(18px);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    transition: transform 0.25s ease, border-color 0.25s ease;
  }

  .login-card:hover {
    transform: translateY(-3px);
    border-color: rgba(127, 203, 150, 0.2);
  }

  .login-eyebrow {
    display: inline-block;
    margin-bottom: 16px;
    padding: 5px 14px;
    border-radius: 20px;
    background: rgba(127, 203, 150, 0.1);
    border: 1px solid rgba(127, 203, 150, 0.25);
    color: var(--green);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .login-card h1 {
    margin: 0 0 10px;
    font-family: 'Fraunces', serif;
    font-size: clamp(28px, 4vw, 36px);
    font-weight: 500;
    line-height: 1.15;
    letter-spacing: -0.02em;
    background: linear-gradient(180deg, #ffffff 0%, #d0dad2 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .login-sub {
    margin: 0 0 28px;
    color: var(--text-soft);
    font-size: 15px;
    line-height: 1.6;
  }

  /* =====================================================
     FORM FIELDS
  ===================================================== */
  .forgot-form {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .forgot-field {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .forgot-field label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-soft);
    letter-spacing: 0.02em;
  }

  .forgot-field input {
    height: 48px;
    padding: 0 16px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    background: rgba(0, 0, 0, 0.25);
    color: #fff;
    font: inherit;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .forgot-field input:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 2px rgba(127, 203, 150, 0.15);
  }

  .forgot-field input::placeholder {
    color: rgba(255, 255, 255, 0.35);
  }

  /* =====================================================
     BUTTONS
  ===================================================== */
  .btn-primary {
    height: 50px;
    border: 0;
    border-radius: 10px;
    background: var(--green);
    color: #070a08;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 8px 20px rgba(127, 203, 150, 0.2);
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(127, 203, 150, 0.35);
    background: #8de3a6;
  }

  .btn-primary:active {
    transform: translateY(0);
  }

  /* =====================================================
     MESSAGE BOX
  ===================================================== */
  .forgot-message {
    display: none;
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.5;
    background: rgba(127, 203, 150, 0.08);
    border: 1px solid rgba(127, 203, 150, 0.2);
    color: var(--green);
  }

  .forgot-message.show {
    display: block;
  }

  /* =====================================================
     FOOTER LINK
  ===================================================== */
  .forgot-back {
    margin-top: 22px;
    text-align: center;
  }

  .forgot-back a {
    color: var(--green);
    font-weight: 600;
    text-decoration: none;
    transition: color 0.2s ease;
  }

  .forgot-back a:hover {
    color: #8de3a6;
  }

  /* =====================================================
     RESPONSIVE
  ===================================================== */
  @media (max-width: 480px) {
    .login-card {
      padding: 32px 24px;
    }

    .login-main {
      padding: 40px 20px;
    }
  }
</style>
<link rel="stylesheet" href="css/flow-polish.css">

</head>

<body class="login-page">

  <header class="login-top">
    <div class="wrap login-nav">
      <a class="login-brand" href="index.html">
        <img src="assets/logo-mark.png" alt="Fundedapple logo" width="24" height="24">
        Fundedapple
      </a>

      <a class="login-back" href="login.html">
        ← Back to login
      </a>
    </div>
  </header>

  <main class="login-main">
    <section class="login-card" aria-labelledby="forgot-title">
      <div class="eyebrow login-eyebrow">
        Account recovery
      </div>

      <h1 id="forgot-title">
        Forgot your password?
      </h1>

      <p class="login-sub">
        Enter the email address associated with your Fundedapple account and we'll help you reset your password.
      </p>

      <form class="forgot-form" id="forgotForm">
        <div class="forgot-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>

        <button class="btn btn-primary forgot-submit" type="submit">Send reset link</button>
      </form>

      <div class="forgot-message" id="forgotMessage" role="status"></div>

      <p class="forgot-back">
        Remember your password? <a href="login.html">Log in</a>
      </p>
    </section>
  </main>

  <script>
    const forgotForm = document.getElementById('forgotForm');
    const forgotMessage = document.getElementById('forgotMessage');

    forgotForm.addEventListener('submit', function(e) {
      e.preventDefault();

      forgotMessage.textContent =
        'Password reset isn\'t available yet — this feature is still being built. Please contact support if you need help accessing your account.';

      forgotMessage.classList.add('show');
    });
  </script>

</body>
</html>
