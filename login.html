<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Fundedapple</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="icon" type="image/png" href="assets/logo-mark.png">
<link rel="stylesheet" href="css/styles.css?v=logo-fix-2">
<link rel="stylesheet" href="css/login.css">

<style>
  /* =====================================================
     THEME VARIABLES
  ===================================================== */
  :root {
    --bg: #070a08;
    --surface: #0e1411;
    --card-bg: rgba(18, 26, 22, 0.55);
    --card-border: rgba(255, 255, 255, 0.08);
    --text: #f0f4f1;
    --text-soft: #9ea8a1;
    --green: #7fcb96;
    --green-glow: rgba(127, 203, 150, 0.22);
    --green-dark: rgba(127, 203, 150, 0.08);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1160px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* =====================================================
     PAGE BACKGROUND
  ===================================================== */
  .login-page {
    min-height: 100vh;
    background:
      radial-gradient(circle at 50% 0%, rgba(127, 203, 150, 0.07) 0%, transparent 60%),
      radial-gradient(circle at 100% 100%, rgba(127, 203, 150, 0.04) 0%, transparent 50%),
      var(--bg);
  }

  /* =====================================================
     TOP NAV
  ===================================================== */
  .login-top {
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    background: rgba(8, 12, 10, 0.85);
    backdrop-filter: blur(16px);
    position: sticky;
    top: 0;
    z-index: 50;
  }

  .login-nav {
    min-height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
  }

  .login-brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: -0.01em;
  }

  .login-brand img {
    width: 24px;
    height: 24px;
    object-fit: contain;
    filter: drop-shadow(0 0 8px rgba(127, 203, 150, 0.3));
  }

  .login-back {
    color: var(--text-soft);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid transparent;
    transition: all 0.2s ease;
  }

  .login-back:hover {
    color: #fff;
    background: rgba(255, 255, 255, 0.04);
    border-color: rgba(255, 255, 255, 0.08);
  }

  /* =====================================================
     MAIN & CARD
  ===================================================== */
  .login-main {
    min-height: calc(100vh - 72px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 24px;
  }

  .login-card {
    width: 100%;
    max-width: 440px;
    padding: 40px 32px;
    border: 1px solid var(--card-border);
    border-radius: 18px;
    background: var(--card-bg);
    backdrop-filter: blur(18px);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    transition: transform 0.25s ease, border-color 0.25s ease;
  }

  .login-card:hover {
    transform: translateY(-3px);
    border-color: rgba(127, 203, 150, 0.2);
  }

  .login-eyebrow {
    display: inline-block;
    margin-bottom: 16px;
    padding: 5px 14px;
    border-radius: 20px;
    background: rgba(127, 203, 150, 0.1);
    border: 1px solid rgba(127, 203, 150, 0.25);
    color: var(--green);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .login-card h1 {
    margin: 0 0 10px;
    font-family: 'Fraunces', serif;
    font-size: clamp(28px, 4vw, 36px);
    font-weight: 500;
    line-height: 1.15;
    letter-spacing: -0.02em;
    background: linear-gradient(180deg, #ffffff 0%, #d0dad2 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .login-sub {
    margin: 0 0 28px;
    color: var(--text-soft);
    font-size: 15px;
    line-height: 1.6;
  }

  /* =====================================================
     FORM FIELDS
  ===================================================== */
  .login-form {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .login-field {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .login-field label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-soft);
    letter-spacing: 0.02em;
  }

  .login-field input {
    height: 48px;
    padding: 0 16px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    background: rgba(0, 0, 0, 0.25);
    color: #fff;
    font: inherit;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .login-field input:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 2px rgba(127, 203, 150, 0.15);
  }

  .login-field input::placeholder {
    color: rgba(255, 255, 255, 0.35);
  }

  /* =====================================================
     PASSWORD TOGGLE
  ===================================================== */
  .password-wrap {
    position: relative;
  }

  .password-wrap input {
    padding-right: 48px;
  }

  .password-toggle {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    color: inherit;
    cursor: pointer;
    padding: 0;
    font-size: 16px;
    line-height: 1;
    transition: opacity 0.2s ease;
  }

  .password-toggle:hover {
    opacity: 0.75;
  }

  .password-toggle:focus-visible {
    outline: 2px solid currentColor;
    outline-offset: 2px;
    border-radius: 4px;
  }

  /* =====================================================
     OPTIONS & BUTTONS
  ===================================================== */
  .login-options {
    display: flex;
    justify-content: flex-end;
  }

  .login-options a {
    color: var(--text-soft);
    font-size: 13px;
    font-weight: 500;
    text-decoration: none;
    transition: color 0.2s ease;
  }

  .login-options a:hover {
    color: #fff;
  }

  .btn-primary {
    height: 50px;
    border: 0;
    border-radius: 10px;
    background: var(--green);
    color: #070a08;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 8px 20px rgba(127, 203, 150, 0.2);
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(127, 203, 150, 0.35);
    background: #8de3a6;
  }

  .btn-primary:active {
    transform: translateY(0);
  }

  /* =====================================================
     FOOTER TEXT
  ===================================================== */
  .login-note {
    margin: 20px 0 0;
    color: var(--text-soft);
    font-size: 12px;
    line-height: 1.5;
    text-align: center;
  }

  .login-home {
    margin: 16px 0 0;
    color: var(--text-soft);
    font-size: 13px;
    text-align: center;
  }

  .login-home a {
    color: var(--green);
    font-weight: 600;
    text-decoration: none;
    transition: color 0.2s ease;
  }

  .login-home a:hover {
    color: #8de3a6;
  }

  /* =====================================================
     RESPONSIVE
  ===================================================== */
  @media (max-width: 480px) {
    .login-card {
      padding: 32px 24px;
    }

    .login-main {
      padding: 40px 20px;
    }
  }
</style>
<link rel="stylesheet" href="css/flow-polish.css">

</head>

<body class="login-page">

  <header class="login-top">
    <div class="wrap login-nav">
      <a class="login-brand" href="index.html">
        <img src="assets/logo-mark.png" alt="Fundedapple logo" width="24" height="24">
        Fundedapple
      </a>

      <a class="login-back" href="index.html">
        ← Back to website
      </a>
    </div>
  </header>

  <main class="login-main">
    <section class="login-card" aria-labelledby="login-title">
      <div class="eyebrow login-eyebrow">
        Trader portal
      </div>

      <h1 id="login-title">
        Welcome back.
      </h1>

      <p class="login-sub">
        Log in to access your Fundedapple account.
      </p>

      <div id="googleBtnContainer" style="display:flex;justify-content:center;margin-bottom:16px;"></div>
      <div class="login-divider" style="display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--text-faint,#6b7280);font-size:12px;">
        <span style="flex:1;height:1px;background:rgba(255,255,255,.12);"></span>
        <span>or continue with email</span>
        <span style="flex:1;height:1px;background:rgba(255,255,255,.12);"></span>
      </div>

      <form class="login-form">
        <div class="login-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>

        <div class="login-field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
            <button class="password-toggle" id="passwordToggle" type="button" aria-label="Show password" aria-pressed="false" title="Show password">◉</button>
          </div>
        </div>

        <div class="login-options">
          <a href="forgot-password.html">Forgot password?</a>
        </div>

        <button class="btn btn-primary login-submit" type="submit">Log in</button>
      </form>

      <form class="login-form" id="loginOtpForm" style="display:none;">
        <div class="login-field">
          <label for="loginOtpCode">Verification code</label>
          <p class="login-sub" style="margin-bottom:8px;">
            Your email isn't verified yet. We sent a 6-digit code to <strong id="loginOtpEmailDisplay"></strong>.
          </p>
          <input id="loginOtpCode" name="loginOtpCode" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6-digit code">
        </div>
        <button class="btn btn-primary login-submit" type="submit">Verify and log in</button>
        <button type="button" id="loginOtpResend" class="btn btn-secondary" style="margin-top:10px;">Resend code</button>
      </form>

      <p class="login-home">
        New to Fundedapple? <a href="create-account.html">Create an account</a>
      </p>
    </section>
  </main>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="js/api.js"></script>
  <script>
  /* =====================================================
     PASSWORD SHOW / HIDE
  ===================================================== */

  const passwordInput = document.getElementById('password');
  const passwordToggle = document.getElementById('passwordToggle');

  function redirectAfterLogin() {
    const params = new URLSearchParams(window.location.search);
    let currentUser = null;
    try {
      currentUser = JSON.parse(sessionStorage.getItem('fundedapple_user') || '{}');
    } catch (e) {
      currentUser = {};
    }

    if (params.get('returnTo') === 'payment') {
      params.delete('returnTo');
      window.location.href = 'payment.html?' + params.toString();
    } else if (currentUser && currentUser.role === 'ADMIN') {
      // Auto-redirect to admin panel for ADMIN accounts
      window.location.href = 'admin.html';
    } else {
      // Normal trader dashboard
      window.location.href = 'dashboard.html';
    }
  }

  /* =====================================================
     GOOGLE SIGN-IN
  ===================================================== */

  async function handleGoogleCredential(response) {
    try {
      const data = await googleSignIn(response.credential);
      sessionStorage.setItem('fundedappleLoggedIn', 'true');
      sessionStorage.setItem('fundedapple_access_token', data.accessToken);
      sessionStorage.setItem('fundedapple_refresh_token', data.refreshToken || '');
      sessionStorage.setItem('fundedapple_user_name', `${data.user.firstName} ${data.user.lastName}`.trim() || data.user.email);
      sessionStorage.setItem('fundedapple_user', JSON.stringify(data.user));
      redirectAfterLogin();
    } catch (error) {
      alert(error.message || 'Google sign-in failed.');
    }
  }

  async function waitForGoogleIdentity(timeout = 10000) {
    const started = Date.now();
    while (!(window.google && window.google.accounts && window.google.accounts.id)) {
      if (Date.now() - started >= timeout) {
        throw new Error('Google Sign-In could not be loaded. Please check your internet connection or try again.');
      }
      await new Promise(resolve => setTimeout(resolve, 100));
    }
    return window.google;
  }

  async function initGoogleSignIn() {
    const container = document.getElementById('googleBtnContainer');
    if (!container) return;

    try {
      const { clientId } = await fetchGoogleClientId();
      if (!clientId) return;

      await waitForGoogleIdentity();

      google.accounts.id.initialize({
        client_id: clientId,
        callback: handleGoogleCredential,
      });

      container.innerHTML = '';
      google.accounts.id.renderButton(
        container,
        { theme: 'filled_black', size: 'large', width: 360, text: 'continue_with', shape: 'rectangular', logo_alignment: 'left' }
      );
      container.dataset.ready = 'true';
    } catch (error) {
      console.error('Google Sign-In not available:', error);
      container.innerHTML = '<span class="google-unavailable">Google Sign-In is temporarily unavailable.</span>';
    }
  }

  initGoogleSignIn();

  passwordToggle.addEventListener('click', function () {
    const isHidden = passwordInput.type === 'password';
    passwordInput.type = isHidden ? 'text' : 'password';
    this.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
    this.setAttribute('aria-pressed', String(isHidden));
    this.setAttribute('title', isHidden ? 'Hide password' : 'Show password');
  });

  document.querySelector('.login-form').addEventListener('submit', async function (e) {
    e.preventDefault();

    const email = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;

    if (!email || !password) {
      alert('Please enter both email and password.');
      return;
    }

    const submitButton = e.currentTarget.querySelector('.login-submit');
    const previousText = submitButton.textContent;
    submitButton.textContent = 'Logging in...';
    submitButton.disabled = true;

    try {
      const data = await loginUser({ email, password });

      sessionStorage.setItem('fundedappleLoggedIn', 'true');
      sessionStorage.setItem('fundedapple_access_token', data.accessToken);
      sessionStorage.setItem('fundedapple_refresh_token', data.refreshToken || '');
      sessionStorage.setItem('fundedapple_user_name', `${data.user.firstName} ${data.user.lastName}`.trim() || data.user.email);
      sessionStorage.setItem('fundedapple_user', JSON.stringify(data.user));

      redirectAfterLogin();
    } catch (error) {
      if (error.data && error.data.requiresVerification) {
        pendingLoginEmail = error.data.email || email;
        document.getElementById('loginOtpEmailDisplay').textContent = pendingLoginEmail;
        document.querySelector('.login-form').style.display = 'none';
        loginOtpForm.style.display = '';
      } else {
        alert(error.message || 'Login failed');
      }
    } finally {
      submitButton.textContent = previousText;
      submitButton.disabled = false;
    }
  });

  /* =====================================================
     VERIFY OTP (for accounts that weren't verified yet)
  ===================================================== */

  let pendingLoginEmail = '';
  const loginOtpForm = document.getElementById('loginOtpForm');

  loginOtpForm.addEventListener('submit', async function (e) {
    e.preventDefault();

    const code = document.getElementById('loginOtpCode').value.trim();
    if (code.length !== 6) {
      alert('Enter the 6-digit code from your email.');
      return;
    }

    const submitButton = e.currentTarget.querySelector('.login-submit');
    const previousText = submitButton.textContent;
    submitButton.textContent = 'Verifying...';
    submitButton.disabled = true;

    try {
      const data = await verifyEmailOtp({ email: pendingLoginEmail, code });

      sessionStorage.setItem('fundedappleLoggedIn', 'true');
      sessionStorage.setItem('fundedapple_access_token', data.accessToken);
      sessionStorage.setItem('fundedapple_refresh_token', data.refreshToken || '');
      sessionStorage.setItem('fundedapple_user_name', `${data.user.firstName} ${data.user.lastName}`.trim() || data.user.email);
      sessionStorage.setItem('fundedapple_user', JSON.stringify(data.user));

      redirectAfterLogin();
    } catch (error) {
      alert(error.message || 'Verification failed');
    } finally {
      submitButton.textContent = previousText;
      submitButton.disabled = false;
    }
  });

  document.getElementById('loginOtpResend').addEventListener('click', async function () {
    this.disabled = true;
    this.textContent = 'Sending...';
    try {
      await resendEmailOtp({ email: pendingLoginEmail });
      alert('A new code has been sent to your email.');
    } catch (error) {
      alert(error.message || 'Could not resend code.');
    } finally {
      this.disabled = false;
      this.textContent = 'Resend code';
    }
  });
</script>

</body>
</html>
